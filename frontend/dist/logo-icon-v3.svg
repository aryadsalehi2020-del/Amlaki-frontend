  <rect x="2" y="2" width="196" height="196" rx="42" fill="none" stroke="#E8E0D4" stroke-width="2"/>

  <!-- Geometric A shape - abstract building/roof -->
  <path d="M100 40 L155 130 H45 Z" fill="none" stroke="#7C8B6F" stroke-width="8" stroke-linejoin="round"/>
