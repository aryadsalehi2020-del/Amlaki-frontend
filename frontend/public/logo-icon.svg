<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <rect width="200" height="200" rx="44" fill="#7C8B6F"/>

  <!-- Letter A stylized -->
  <text x="50%" y="54%" dominant-baseline="central" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="120" fill="#FAF7F2" letter-spacing="-2">
    A
  </text>

  <!-- Small I indicator bottom right -->
  <rect x="140" y="140" width="36" height="36" rx="10" fill="#FAF7F2"/>
  <text x="158" y="164" dominant-baseline="central" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="24" fill="#7C8B6F">
    I
  </text>
</svg>
